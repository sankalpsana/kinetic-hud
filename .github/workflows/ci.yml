name: Kinetic HUD CI & Vercel Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Verify Turbopack Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: frontend
        run: npm install --include=optional

      - name: Build Next.js Production Bundle
        working-directory: frontend
        run: |
          npm run build 2>&1 | tee build.log || {
            ERR=$(tail -n 30 build.log | tr '\n' ' ')
            echo "::error title=NextBuildError::$ERR"
            exit 1
          }
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_MODAL_API_URL: ${{ secrets.NEXT_PUBLIC_MODAL_API_URL }}
